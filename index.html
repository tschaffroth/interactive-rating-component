<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link href="style.css" rel="stylesheet" />

    <title>Frontend Mentor | Interactive rating component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
    <div class="container">
      <div class="rating-component">
        <img src="assets/images/icon-star.svg" class="rating-component__image margin-bottom-24" alt="star"/>

        <h1 class="rating-component__title text-preset-2 margin-bottom-16">How did we do?</h1>

        <p class="rating-component__text text-preset-5 margin-bottom-16">Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>

        <div class="rating-scale margin-bottom-24">
          <button class="rating-scale__button">1</button>
          <button class="rating-scale__button">2</button>
          <button class="rating-scale__button">3</button>
          <button class="rating-scale__button">4</button>
          <button class="rating-scale__button">5</button>
        </div>
        <button class="rating-component__submit rating-component__submit--inactive text-preset-5-bold">Submit</button>
      </div>

      <section class="confirmation-component component--invisible">
        <img src="assets/images/illustration-thank-you.svg" class="confirmation-component__image margin-bottom-24"/>
        <span class="confirmation-component__result text-preset-5 margin-bottom-24"></span>
        <h1 class="confirmation-component__title text-preset-2 margin-bottom-16">Thank you!</h1>
        <p class="confirmation-component__text text-preset-5">We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch!</p>
      </section>
    </div>
    </main>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
